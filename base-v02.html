function originalGuard(v){return typeof v==='object'&&v!==null&&!Array.isArray(v)&&typeof v.id==='string'&&typeof v.entreprise==='string'&&typeof v.posteVise==='string'&&typeof v.contrat==='string'&&v.contrat in contracts&&typeof v.statut==='string'&&v.statut in statuses&&typeof v.dateCreation==='string'&&typeof v.priorite==='string'&&v.priorite in priorities&&(v.mode==='annonce'||v.mode==='spontanee');}

function failure(){let x=copy(seed[1]);if(fault==='source')delete x.sourceAnnonce;if(fault==='status')x.statut='en_cours';if(fault==='inherited')x.statut='constructor';if(fault==='date')x.dateCreation='2026-99-99';if(fault==='notes')x.notes=500;let old=originalGuard(x),strong=strongerGuard(x),pass=repaired?strong:old;return header('04','Failure Lab','Injecte une anomalie dans le circuit de validation puis compare les deux inspections.')+`<div class="workgrid"><div class="panel"><label for="fault">Défaut injecté</label><select id="fault" class="selectwide" data-change="fault">${options(Object.fromEntries(Object.entries(faults).map(([k,v])=>[k,v[0]])),fault)}</select><h3>Objet entrant (JSON)</h3>${code(JSON.stringify(x,null,2))}<label class="choice"><input type="checkbox" data-change="repaired" ${repaired?'checked':''}> Utiliser le garde renforcé (proposition)</label></div><div class="stack"><div class="panel"><h3>Station de contrôle</h3>${engine(2,120)}<div class="kv"><span>isCandidature() original</span><code style="color:${old?'var(--teal)':'var(--red)'}">${old?'true · admis':'false · rejeté'}</code></div><div class="kv"><span>Garde renforcé</span><code style="color:${strong?'var(--teal)':'var(--red)'}">${strong?'true · admis':'false · rejeté'}</code></div><div class="callout ${pass&&!strong?'warn':!pass?'bad':''}">${pass?'Objet transmis au store.':'Objet éliminé par filter().'} ${esc(faults[fault][1])}</div></div><div class="panel"><h3>Proposition de réparation</h3>${code('Object.hasOwn(STATUT_CANDIDATURE, statut)\n// Contrôler les champs obligatoires par mode\n// Valider les dates calendaires et champs facultatifs') }<p class="tiny">Les deux gardes sont exécutés en JavaScript dans ce laboratoire. Le garde renforcé reste une proposition pédagogique et ne vérifie pas tous les invariants métier (URL sûre, ID unique, etc.).</p></div></div></div>${end('failure')}`}

function xEnd(){return !xFrames.length||xStep===xFrames.length-1;}
function xNavigate(i){xFocusId=null;xField=null;xStep=Math.max(0,Math.min(xFrames.length-1,i));if(xEnd()&&xFrames.length)xState=copy(xFrames[xStep].state);if(xFrames.length)xUnit=xFrames[xStep].unit;if(xEnd())xStop();render();}
function xTrace(event,id,payload){if(!xEnd())return; xStop(); let s=copy(xState),frames=[]; const push=(unit,title,code,desc)=>frames.push({unit,title,code,desc,state:copy(s)}); const target=s.jobs.find(j=>j.id===id);push('dashboard','État initial','/* avant interaction */','Le snapshot et les états UI avant l’événement.');
if(event==='select'&&target){push('prop','Clic sur la ligne',`onRowClick("${id}")`,'Le tableau transmet l’argument au setter reçu.');s.selected=id;push('selectedId','Mise à jour programmée',`setSelectedId("${id}")`,'On représente la prochaine valeur d’état (React ne modifie pas la variable du rendu en cours).');push('find','Donnée dérivée','candidatures.find(c => c.id === selectedId) ?? null','La recherche retrouve l’objet à partir de l’ID.');push('drawer','Nouveau rendu','selectedCandidature && <DetailDrawer … />','Le panneau est monté. Le store est inchangé.');}
else if(event==='open'){push('editingId','Clic Ajouter','setEditingId(null)','Le bouton efface la cible d’édition.');s.editing=null;s.form=true;xDraft={entreprise:'',posteVise:'',statut:'a_preparer',priorite:'moyenne',contrat:'cdi',mode:'spontanee',dateCreation:'2026-11-16'};push('showForm','Ouverture programmée','setShowForm(true)','Les mises à jour locales peuvent être regroupées.');push('form','Formulaire de création','candidatureToEdit={undefined}','Le formulaire n’a aucune cible.');}
else if(event==='close'){push('drawer','Fermeture','onClose()','Le callback est fourni par le parent.');s.selected=null;push('selectedId','Retour au tableau','setSelectedId(null)','Le détail disparaît ; aucun objet supprimé.');}
else if(event==='cancel'){push('closeForm','Annuler','closeForm()','Le callback réinitialise les commandes UI.');s.form=false;s.editing=null;push('form','Formulaire démonté','setShowForm(false); setEditingId(null);','Aucune sauvegarde.');}
else if(event==='edit'&&target){push('id','Clic Éditer',`onEdit("${id}")`,'L’argument traverse la prop de rappel.');push('edit','Recherche de la cible','candidatures.find(c => c.id === id)','La garde vérifie que la candidature existe.');s.editing=id;s.selected=null;s.form=true;xDraft=copy(target);push('edit','Transition groupée','setEditingId(id); setSelectedId(null); setShowForm(true);','Le prochain rendu ouvre le formulaire et ferme le détail.');push('form','Formulaire d’édition','candidatureToEdit={editingCandidature ?? undefined}','L’objet dérivé est transmis à l’enfant.');}
else if(event==='delete'&&target){push('handleDelete','Confirmation','window.confirm(…) → true','La suppression est explicitement confirmée dans le simulateur.');push('delete','Transformation immutable','candidatures.filter(c => c.id !== id)','Le prochain tableau écarte l’objet ciblé.');xWrite(s,s.jobs.filter(j=>j.id!==id),push);if(s.selected===id)s.selected=null;push('dashboard','Rendu actualisé','setSelectedId(null)','Le détail disparaît et le tableau reflète le nouveau snapshot.');}
else if(event==='submit'&&payload){const edit=s.jobs.find(j=>j.id===s.editing);push('submit','Soumission','onSubmit(submittedCandidature)','Le Dashboard choisit la branche à partir de editingCandidature.');const obj={...payload,id:edit?edit.id:'demo_'+String(xCounter++).padStart(3,'0')};const result=edit?s.jobs.map(j=>j.id===obj.id?obj:j):[...s.jobs,obj];push(edit?'update':'add',edit?'Remplacement par map':'Ajout par spread',edit?'candidatures.map(…)':'[...candidatures, newCandidature]','Un nouveau tableau est créé ; le snapshot courant n’est pas muté.');xWrite(s,result,push);s.form=false;s.editing=null;push('closeForm','Fermeture du formulaire','closeForm()','Le rendu suivant présente la collection actualisée.');}
else if(event==='reload'){s.selected=null;s.editing=null;s.form=false;s.pending='';push('snapshot','Actualisation simulée','hasHydrated = false','Les états du composant sont réinitialisés.');s.jobs=copy(s.disk);s.rev++;push('guard','Relecture du stockage','readFromLocalStorage()','Le cache est reconstitué à partir du disque simulé.');push('dashboard','Rendu après relecture','getCandidaturesSnapshot()','Les écritures non persistées ont disparu.');}
else return;
xFocusId=null;xField=null;xFrames=frames;xStep=1;xUnit=frames[1].unit;if(xEnd())xState=copy(xCurrent());render();}
function xWrite(s,next,push){s.jobs=next;s.rev++;s.pending='Notification en attente';push('save','Cache remplacé','cache = next','Le tableau en mémoire change de référence. La vue est un instantané pédagogique, pas un commit React.');if(!xFault)s.disk=copy(next);push('save',xFault?'Échec de persistance':'Persistance',xFault?'localStorage.setItem(…) → erreur':'localStorage.setItem(STORAGE_KEY, JSON.stringify(next))',xFault?'Le cache reste changé mais le disque reste ancien.':'Le disque simulé reçoit le nouveau contenu.');s.pending='';push('snapshot','Notification des abonnés','listeners.forEach(listener => listener())','React peut relire le snapshot et programmer un rendu ; le nombre exact de rendus n’est pas simulé.');}
function xBadge(v,kind){const t=kind==='status'?statuses[v]:priorities[v];return kind==='status'?`<span class="xbadge" style="background:${t[2]};color:${t[3]};border-color:${t[1]}55">${esc(t[0])}</span>`:`<span class="xbadge" style="background:${t.bg};color:${t.fg};border-color:${t.color}55">${esc(t.label)}</span>`;}
function xDatum(v){return esc(JSON.stringify(v??null));}
function xValue(key,s){const j=s.jobs.find(j=>j.id===xFocusId)||s.jobs.find(j=>j.id===s.selected)||s.jobs.find(j=>j.id===s.editing)||s.jobs[0];switch(key){case'selectedId':return s.selected;case'showForm':return s.form;case'editingId':return s.editing;case'candidatures':return s.jobs.map(j=>j.id);case'mode':return j?.mode;case'id':return j?.id;case'formatDate':return formatDate(xField==='relance'?j?.dateRelance:j?.dateCreation);case'contract':return j?.contrat;case'badge':return j?.statut;case'priority':return j?.priorite;case'find':case'return':return s.jobs.find(j=>j.id===s.selected)?.id??null;case'snapshot':return `Référence simulée #${s.rev}`;default:return 'Voir le code et les flux';}}
function xButton(action,label,extra='',cls=''){return `<button class="${cls}" data-x="${action}" ${extra}>${label}</button>`}
function xCell(unit,content,id,field=''){ return `<button class="xcell ${xMode==='inspect'&&xUnit===unit?'xmark':''}" data-x="${xMode==='inspect'?'unit':'select'}" data-unit="${unit}" data-id="${id}" data-field="${field}" ${!xEnd()?'disabled':''}>${content}</button>`;}
function xPreview(s){const j=s.jobs.find(j=>j.id===s.selected),ed=s.jobs.find(j=>j.id===s.editing);let d=xDraft||ed||{};const dis=xEnd()?'':'disabled';return `<section class="xapp" aria-label="Reproduction du dashboard Jobboard"><div class="xapp-top"><span>Suivi candidatures</span><p>Une première version pour suivre les candidatures, les statuts, les priorités et les prochaines actions.</p></div><div class="xapp-head"><h2>Tableau de bord</h2>${xButton('event','Ajouter une candidature',`data-event="open" ${dis}`,'xblue')}</div><div class="x-tablewrap"><table class="xtable"><thead><tr>${['Entreprise','Poste visé','Contrat','Statut','Priorité','Créée le','Relance'].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${s.jobs.map(j=>`<tr class="${j.id===s.selected?'xselected':''}"><td>${xButton('event',esc(j.entreprise),`data-event="select" data-id="${j.id}" ${dis}`,'xcell xcompany')}</td><td>${xCell('candidatures',esc(j.posteVise),j.id)}</td><td>${xCell('contract',esc(contracts[j.contrat]),j.id)}</td><td>${xCell('badge',xBadge(j.statut,'status'),j.id)}</td><td>${xCell('priority',xBadge(j.priorite,'priority'),j.id)}</td><td>${xCell('formatDate',esc(formatDate(j.dateCreation)),j.id)}</td><td>${xCell('formatDate',esc(formatDate(j.dateRelance)),j.id,'relance')}</td></tr>`).join('')||'<tr><td colspan="7">Aucune candidature</td></tr>'}</tbody></table></div>${j?`<div class="xdrawer"><div class="xapp-head"><div><h3>${esc(j.entreprise)}</h3><span class="xmode">${j.mode==='annonce'?'Réponse à une annonce':'Candidature spontanée'}</span></div>${xButton('event','✕',`data-event="close" aria-label="Fermer le détail" ${dis}`,'xplain')}</div><p>${esc(j.posteVise)}</p><div class="xdetailgrid"><div><small>Contrat</small>${esc(contracts[j.contrat])}</div><div><small>Statut</small>${xBadge(j.statut,'status')}</div><div><small>Priorité</small>${xBadge(j.priorite,'priority')}</div><div><small>Créée le</small>${esc(formatDate(j.dateCreation))}</div><div><small>Envoyée le</small>${esc(formatDate(j.dateEnvoi))}</div><div><small>Relance prévue</small>${esc(formatDate(j.dateRelance))}</div></div><div class="xsource">${j.mode==='annonce'?'Source : '+esc(sources[j.sourceAnnonce]):'Candidature spontanée'+(j.canalApproche?' · '+esc(canals[j.canalApproche]):'')}</div><div class="xapp-head">${xButton('event','Fermer',`data-event="close" ${dis}`,'xplain')}<div class="row">${xButton('event','Supprimer',`data-event="delete" data-id="${j.id}" ${dis}`,'xred')}${xButton('event','Éditer',`data-event="edit" data-id="${j.id}" ${dis}`,'xblue')}</div></div></div>`:''}${s.form?`<form id="xform" class="xdrawer"><div class="xapp-head"><h3>${ed?'Modifier la candidature':'Nouvelle candidature'}</h3><span class="xmode">${ed?'Édition':'Création'} · formulaire simplifié</span></div><fieldset ${dis}><label>Entreprise<input name="entreprise" required value="${esc(d.entreprise||'')}"></label><label>Poste visé<input name="posteVise" required value="${esc(d.posteVise||'')}"></label><div class="xdetailgrid"><label>Contrat<select name="contrat">${options(contracts,d.contrat)}</select></label><label>Statut<select name="statut">${options(Object.fromEntries(Object.entries(statuses).map(([k,v])=>[k,v[0]])),d.statut)}</select></label><label>Priorité<select name="priorite">${options(Object.fromEntries(Object.entries(priorities).map(([k,v])=>[k,v.label])),d.priorite)}</select></label></div><div class="row">${xButton('event','Annuler',`type="button" data-event="cancel" ${dis}`,'xplain')}<button type="submit" class="xblue">Enregistrer</button></div></fieldset></form>`:''}<div class="xapp-foot">${xMode==='inspect'?'X-RAY : clique sur une cellule pour inspecter une unité ; le nom de l’entreprise ouvre le détail.':'NORMAL : clique sur une cellule pour sélectionner une ligne.'} · ${s.jobs.length} candidature(s)</div></section>`;}
function xInspector(s){const u=xUnits[xUnit];return `<section class="panel xinspector"><div class="row between"><span class="eyebrow">Anatomy Inspector</span><span class="filetag">N${u.level}</span></div><h2>${esc(u.title)}</h2><p class="tiny">${esc(u.file)} · ${esc(u.kind)}</p><div class="xanalogy"><span class="xgear">⚙</span><div><strong>${esc(u.analogy)}</strong><p class="tiny">Analogie mécanique</p></div></div><p>${esc(u.role)}</p><div class="kv"><span>Entrée</span><code>${esc(u.ins)}</code></div><div class="kv"><span>Sortie</span><code>${esc(u.outs)}</code></div><div class="kv"><span>Valeur observée</span><code>${xDatum(xValue(xUnit,s))}</code></div><div class="xsourcecode">${code(u.src)}</div><div class="xexplain"><b>Effet</b><p>${esc(u.effect)}</p><b>Dépendances</b><p>${esc(u.deps)}</p></div></section>`;}
function xFlow(s){const order=[['table','UI · Table'],['prop','Callback'],['dashboard','Dashboard'],['save','Store'],['snapshot','Snapshot'],['drawer','UI · Drawer']];const related={selectedId:'dashboard',showForm:'dashboard',editingId:'dashboard',id:'prop',candidatures:'snapshot',find:'dashboard',return:'dashboard',edit:'dashboard',submit:'dashboard',add:'dashboard',update:'dashboard',delete:'dashboard',closeForm:'dashboard',handleDelete:'drawer',guard:'store',formatDate:'drawer',badge:'table',priority:'table',contract:'table',form:'drawer'};let active=related[xUnit]||xUnit;return `<section class="panel"><div class="row between"><h3>Transmission fonctionnelle</h3><span class="filetag">FLOW MAP</span></div><svg viewBox="0 0 620 198" role="img" aria-label="Flux de callbacks, données et notifications" class="xflow"><defs><marker id="xfa" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#8bacb2"/></marker></defs><path d="M157 43 H237 M382 43 H464 M524 65 V129 M464 152 H382 M237 152 H157 M96 129 V65" fill="none" stroke="#8bacb2" stroke-width="1.8" marker-end="url(#xfa)"/><g fill="#a0b5bb" font-size="10" text-anchor="middle"><text x="197" y="36">ID</text><text x="423" y="36">appel</text><text x="560" y="98">écriture</text><text x="422" y="145">signal</text><text x="196" y="145">props</text><text x="132" y="98">rendu</text></g>${order.map(([k,n],i)=>{let p=[[25,20],[237,20],[464,20],[464,129],[237,129],[25,129]][i];return `<g><rect x="${p[0]}" y="${p[1]}" width="132" height="45" rx="8" fill="${active===k?'#254a44':'#19282e'}" stroke="${active===k?'#64dac4':'#425960'}" stroke-width="${active===k?2.5:1}"/><text x="${p[0]+66}" y="${p[1]+27}" fill="${active===k?'#64dac4':'#ecf1ed'}" font-size="12" text-anchor="middle">${n}</text></g>`}).join('')}</svg><p class="tiny">Carte conceptuelle : une sélection ne traverse pas le store ; seules les actions métier sauvegardent. Les props descendent, les callbacks remontent.</p><div class="row" style="margin-top:10px">${order.map(([k,n])=>xButton('unit',n,`data-unit="${k}"`,'ghost tiny')).join('')}</div></section>`;}
function xStatePanel(s){return `<section class="panel"><div class="row between"><h3>Capteurs d’état</h3><span class="filetag">LIVE MODEL</span></div><div class="xstategrid">${[['selectedId',s.selected],['editingId',s.editing],['showForm',s.form],['selectedCandidature',s.jobs.find(j=>j.id===s.selected)?.entreprise??null],['editingCandidature',s.jobs.find(j=>j.id===s.editing)?.entreprise??null],['snapshot',`#${s.rev}`],['cache.length',s.jobs.length],['disk.length',s.disk.length]].map(([k,v])=>`<div><small>${k}</small><strong>${xDatum(v)}</strong></div>`).join('')}</div><p class="tiny">${s.pending?esc(s.pending)+' · ':''}${JSON.stringify(s.jobs)===JSON.stringify(s.disk)?'Cache et stockage simulé identiques.':'Attention : cache et stockage simulé divergents.'}</p></section>`;}
function xTimeline(){const f=xFrames[xStep];return `<section class="panel xtimeline"><div class="row between"><div><span class="eyebrow">Chronologie d’exécution</span><h3>${f?esc(f.title):'En attente d’une interaction'}</h3></div><span class="filetag">${xFrames.length?`${xStep+1} / ${xFrames.length}`:'0 / 0'}</span></div><div class="xsteps">${xFrames.length?xFrames.map((f,i)=>xButton('step',`<span>${String(i+1).padStart(2,'0')}</span>${esc(f.title)}`,`data-index="${i}"`,`${i===xStep?'on':''} ${i<xStep?'passed':''}`)).join(''):'<p>Clique sur une entreprise, le bouton Ajouter ou Actualiser pour lancer une expérience.</p>'}</div>${f?`<div class="xtracecode">${code(f.code)}<p>${esc(f.desc)}</p></div>`:''}<div class="row between"><div class="row">${xButton('prev','← Précédent',xStep>0?'':'disabled')}${xButton('next','Suivant →',xEnd()?'disabled':'','primary')}${xButton('play',xTimer?'Pause':'▶ Lecture',!xFrames.length?'disabled':'')}${xButton('finish','Fin',xEnd()?'disabled':'')}</div><span class="tiny muted">Étapes logiques, pas des commits React mesurés.</span></div></section>`;}
function xProbeView(){const list=xSeed, target=list.find(j=>j.id===xProbeId);let output,example,meaning;if(xProbe==='find'){output=target??null;example='candidatures.find(c => c.id === id) ?? null';meaning='Retour : objet unique ou null ; le tableau original reste intact.';}else if(xProbe==='filter'){output=list.filter(j=>j.id!==xProbeId).map(j=>j.entreprise);example='candidatures.filter(c => c.id !== id)';meaning='Retour : nouveau tableau ; la collection originale ne change pas.';}else if(xProbe==='map'){output=list.map(j=>({entreprise:j.id===xProbeId?j.entreprise+' (modifiée)':j.entreprise,memeReference:j.id!==xProbeId}));example='candidatures.map(c => c.id === id ? updated : c)';meaning='Retour : nouveau tableau ; seul l’objet ciblé est remplacé s’il existe.';}else{output=formatDate(xProbeArg||undefined);example='formatDate(date)';meaning='Retour : chaîne localisée ou tiret, avec le fuseau du navigateur.';}return `<section class="panel"><div class="row between"><h3>Micro-banc de fonctions</h3><span class="filetag">INPUT → OUTPUT</span></div><p class="tiny">Exécutions JavaScript isolées sur les trois données de la capture.</p><div class="tabs">${['find','filter','map','formatDate'].map(k=>xButton('probe',k+'()',`data-probe="${k}"`,xProbe===k?'on':'')).join('')}</div>${xProbe==='formatDate'?`<label>Argument date (vide = undefined)<input data-xchange="probeArg" value="${esc(xProbeArg)}" class="selectwide"></label>`:`<label>Argument id<select data-xchange="probeId" class="selectwide">${options({...Object.fromEntries(list.map(j=>[j.id,j.entreprise])),missing:'ID inexistant'},xProbeId)}</select></label>`}${code(example)}<label>Prédiction : écris le résultat attendu avant de le révéler</label><textarea id="xprediction" placeholder="Que retourne la fonction ?">${esc(xPrediction)}</textarea><div class="row" style="margin-top:8px">${xButton('reveal',xReveal?'Masquer le résultat':'Exécuter / révéler', '', 'primary')}</div>${xReveal?`${code(JSON.stringify(output,null,2))}<p>${esc(meaning)}</p>`:''}</section>`;}
function inspect(){const s=xCurrent();return `<div class="pagehead"><div><div class="eyebrow">Atelier 08 · Jobboard · X-Ray</div><h1>Dissection fonctionnelle</h1><p>De l’atome de code au composant : observe, prédis, exécute, puis explique.</p></div><span class="tag">V0.2 · NOUVEAU</span></div><div class="panel xcontrols"><div class="row between"><div class="tabs" style="margin:0">${xButton('mode','Normal','data-mode="normal"',xMode==='normal'?'on':'')}${xButton('mode','Inspect / X-Ray','data-mode="inspect"',xMode==='inspect'?'on':'')}</div><div class="row">${xButton('event','↻ Actualiser',`data-event="reload" ${!xEnd()?'disabled':''}`)}${xButton('reset','Réinitialiser')}</div></div><label class="choice" style="margin-bottom:0"><input type="checkbox" data-xchange="fault" ${xFault?'checked':''} ${!xEnd()?'disabled':''}>Injecter une panne d’écriture localStorage lors de la prochaine sauvegarde</label></div><div class="xworkspace">${xPreview(s)}${xInspector(s)}</div>${xTimeline()}<div class="workgrid xlower">${xFlow(s)}${xStatePanel(s)}</div><div class="section-title"><h2>Atelier de micro-dissection</h2><span class="mono tiny muted">${Object.keys(xUnits).length} UNITÉS · 5 ÉCHELLES</span></div><div class="workgrid"><section class="panel"><h3>Explorateur des pièces</h3><p class="tiny">Sélectionne une unité pour retrouver sa fiche dans l’inspecteur.</p><div class="tabs">${['all',...xLevels.map((_,i)=>String(i))].map(k=>xButton('level',k==='all'?'Toutes':xLevels[+k],`data-level="${k}"`,xLevel===k?'on':'')).join('')}</div><div class="xunits">${Object.entries(xUnits).filter(([,u])=>xLevel==='all'||u.level===+xLevel).map(([k,u])=>xButton('unit',`<span>${esc(u.title)}</span><small>${esc(u.file)} · N${u.level}</small>`,`data-unit="${k}"`,xUnit===k?'on':'')).join('')}</div><div class="callout tiny">Les extraits reproduisent le code fourni ou sont signalés comme extraits. Les modes et IDs de la capture ont été complétés pour le modèle. Le formulaire est une reconstitution, pas le fichier original.</div></section>${xProbeView()}</div>${end('inspect')}`;}
// New controls use separate data attributes so the original seven labs remain untouched.
document.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;let a=b.dataset.x;switch(a){case'unit':xUnit=b.dataset.unit;xFocusId=b.dataset.id||null;xField=b.dataset.field||null;render();return;case'select':xTrace('select',b.dataset.id);return;case'event':if(b.dataset.event==='delete'&&!confirm('Supprimer définitivement cette candidature de la simulation ?'))return;xTrace(b.dataset.event,b.dataset.id);return;case'mode':xMode=b.dataset.mode;break;case'reset':xStop();xState=xInitial();xFrames=[];xStep=0;xUnit='selectedId';xFocusId=null;xField=null;xFault=false;xDraft=null;xCounter=4;break;case'step':xStop();xNavigate(+b.dataset.index);return;case'prev':xStop();xNavigate(xStep-1);return;case'next':xStop();xNavigate(xStep+1);return;case'finish':xStop();xNavigate(xFrames.length-1);return;case'play':if(xTimer){xStop();render();return;}if(xEnd())xStep=0;xTimer=setInterval(()=>{if(page!=='inspect'){xStop();return;}xNavigate(xStep+1)},1250);render();return;case'level':xLevel=b.dataset.level;break;case'probe':xProbe=b.dataset.probe;xReveal=false;xPrediction='';break;case'reveal':xReveal=!xReveal;break;default:return;}render();});
document.addEventListener('change',e=>{const k=e.target.dataset.xchange;if(!k)return;switch(k){case'fault':xFault=e.target.checked;break;case'probeArg':xProbeArg=e.target.value;xReveal=false;break;case'probeId':xProbeId=e.target.value;xReveal=false;break;}render();});
document.addEventListener('input',e=>{if(e.target.id==='xprediction')xPrediction=e.target.value; if(e.target.closest('#xform')&&e.target.name&&xDraft)xDraft={...xDraft,[e.target.name]:e.target.value};});
document.addEventListener('submit',e=>{if(e.target.id!=='xform')return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.entreprise.trim()||!f.posteVise.trim()||!xEnd())return;xTrace('submit',null,{...xDraft,...f});});

window.addEventListener('hashchange',()=>{let id=location.hash.slice(1);if(renders[id]&&id!==page){page=id;render();window.scrollTo(0,0);}});let initial=location.hash.slice(1);if(renders[initial])page=initial;render();
</script></body></html>
