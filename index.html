function xPreview(s){const j=s.jobs.find(j=>j.id===s.selected),ed=s.jobs.find(j=>j.id===s.editing);let d=xDraft||ed||{};const dis=xEnd()?'':'disabled';return `<section class="xapp" aria-label="Reproduction du dashboard Jobboard"><div class="xapp-top"><span>Suivi candidatures</span><p>Une première version pour suivre les candidatures, les statuts, les priorités et les prochaines actions.</p></div><div class="xapp-head"><h2>Tableau de bord</h2>${xButton('event','Ajouter une candidature',`data-event="open" ${dis}`,'xblue')}</div><div class="x-tablewrap"><table class="xtable"><thead><tr>${['Entreprise','Poste visé','Contrat','Statut','Priorité','Créée le','Relance'].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${s.jobs.map(j=>`<tr class="${j.id===s.selected?'xselected':''}"><td>${xButton('event',esc(j.entreprise),`data-event="select" data-id="${j.id}" ${dis}`,'xcell xcompany')}</td><td>${xCell('candidatures',esc(j.posteVise),j.id)}</td><td>${xCell('contract',esc(contracts[j.contrat]),j.id)}</td><td>${xCell('badge',xBadge(j.statut,'status'),j.id)}</td><td>${xCell('priority',xBadge(j.priorite,'priority'),j.id)}</td><td>${xCell('formatDate',esc(formatDate(j.dateCreation)),j.id)}</td><td>${xCell('formatDate',esc(formatDate(j.dateRelance)),j.id,'relance')}</td></tr>`).join('')||'<tr><td colspan="7">Aucune candidature</td></tr>'}</tbody></table></div>${j?`<div class="xdrawer"><div class="xapp-head"><div><h3>${esc(j.entreprise)}</h3><span class="xmode">${j.mode==='annonce'?'Réponse à une annonce':'Candidature spontanée'}</span></div>${xButton('event','✕',`data-event="close" aria-label="Fermer le détail" ${dis}`,'xplain')}</div><p>${esc(j.posteVise)}</p><div class="xdetailgrid"><div><small>Contrat</small>${esc(contracts[j.contrat])}</div><div><small>Statut</small>${xBadge(j.statut,'status')}</div><div><small>Priorité</small>${xBadge(j.priorite,'priority')}</div><div><small>Créée le</small>${esc(formatDate(j.dateCreation))}</div><div><small>Envoyée le</small>${esc(format function xInspector(s){const u=xUnits[xUnit];return `<section class="panel xinspector"><div class="row between"><span class="eyebrow">Anatomy Inspector</span><span class="filetag">N${u.level}</span></div><h2>${esc(u.title)}</h2><p class="tiny">${esc(u.file)} · ${esc(u.kind)}</p><div class="xanalogy"><span class="xgear">⚙</span><div><strong>${esc(u.analogy)}</strong><p class="tiny">Analogie mécanique</p></div></div><p>${esc(u.role)}</p><div class="kv"><span>Entrée</span><code>${esc(u.ins)}</code></div><div class="kv"><span>Sortie</span><code>${esc(u.outs)}</code></div><div class="kv"><span>Valeur observée</span><code>${xDatum(xValue(xUnit,s))}</code></div><div class="xsourcecode">${code(u.src)}</div><div class="xexplain"><b>Effet</b><p>${esc(u.effect)}</p><b>Dépendances</b><p>${esc(u.deps)}</p></div></section>`;}
function xFlow(s){const order=[['table','UI · Table'],['prop','Callback'],['dashboard','Dashboard'],['save','Store'],['snapshot','Snapshot'],['drawer','UI · Drawer']];const related={selectedId:'dashboard',showForm:'dashboard',editingId:'dashboard',id:'prop',candidatures:'snapshot',find:'dashboard',return:'dashboard',edit:'dashboard',submit:'dashboard',add:'dashboard',update:'dashboard',delete:'dashboard',closeForm:'dashboard',handleDelete:'drawer',guard:'store',formatDate:'drawer',badge:'table',priority:'table',contract:'table',form:'drawer'};let active=related[xUnit]||xUnit;return `<section class="panel"><div class="row between"><h3>Transmission fonctionnelle</h3><span class="filetag">FLOW MAP</span></div><svg viewBox="0 0 620 198" role="img" aria-label="Flux de callbacks, données et notifications" class="xflow"><defs><marker id="xfa" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#8bacb2"/></marker></defs><path d="M157 43 H237 M382 43 H464 M524 65 V129 M464 152 H382 M237 152 H157 M96 129 V65" fill="none" stroke="#8bacb2" stroke-width="1.8" marker-end="url(#xfa)"/><g fill="#a0b5bb" font-size="10" text-anchor="middle"><text x="197" y="36">ID</text><text x="423" y="36">appel</text><text x="560" y="98">écriture</text><text x="422" y="145">signal</text><text x="196" y="145">props</text><text x="132" y="98">rendu</text></g>${order.map(([k,n],i)=>{let p=[[25,20],[237,20],[464,20],[464,129],[237,129],[25,129]][i];return `<g><rect x="${p[0]}" y="${p[1]}" width="132" height="45" rx="8" fill="${active===k?'#254a44':'#19282e'}" stroke="${active===k?'#64dac4':'#425960'}" stroke-width="${active===k?2.5:1}"/><text x="${p[0]+66}" y="${p[1]+27}" fill="${active===k?'#64dac4':'#ecf1ed'}" font-size="12" text-anchor="middle">${n}</text></g>`}).join('')}</svg><p class="tiny">Carte conceptuelle : une sélection ne traverse pas le store ; seules les actions métier sauvegardent. Les props descendent, les callbacks remontent.</p><div class=" function xStatePanel(s){return `<section class="panel"><div class="row between"><h3>Capteurs d’état</h3><span class="filetag">LIVE MODEL</span></div><div class="xstategrid">${[['selectedId',s.selected],['editingId',s.editing],['showForm',s.form],['selectedCandidature',s.jobs.find(j=>j.id===s.selected)?.entreprise??null],['editingCandidature',s.jobs.find(j=>j.id===s.editing)?.entreprise??null],['snapshot',`#${s.rev}`],['cache.length',s.jobs.length],['disk.length',s.disk.length]].map(([k,v])=>`<div><small>${k}</small><strong>${xDatum(v)}</strong></div>`).join('')}</div><p class="tiny">${s.pending?esc(s.pending)+' · ':''}${JSON.stringify(s.jobs)===JSON.stringify(s.disk)?'Cache et stockage simulé identiques.':'Attention : cache et stockage simulé divergents.'}</p></section>`;}
function xTimeline(){const f=xFrames[xStep];return `<section class="panel xtimeline"><div class="row between"><div><span class="eyebrow">Chronologie d’exécution</span><h3>${f?esc(f.title):'En attente d’une interaction'}</h3></div><span class="filetag">${xFrames.length?`${xStep+1} / ${xFrames.length}`:'0 / 0'}</span></div><div class="xsteps">${xFrames.length?xFrames.map((f,i)=>xButton('step',`<span>${String(i+1).padStart(2,'0')}</span>${esc(f.title)}`,`data-index="${i}"`,`${i===xStep?'on':''} ${i<xStep?'passed':''}`)).join(''):'<p>Clique sur une entreprise, le bouton Ajouter ou Actualiser pour lancer une expérience.</p>'}</div>${f?`<div class="xtracecode">${code(f.code)}<p>${esc(f.desc)}</p></div>`:''}<div class="row between"><div class="row">${xButton('prev','← Précédent',xStep>0?'':'disabled')}${xButton('next','Suivant →',xEnd()?'disabled':'','primary')}${xButton('play',xTimer?'Pause':'▶ Lecture',!xFrames.length?'disabled':'')}${xButton('finish','Fin',xEnd()?'disabled':'')}</div><span class="tiny muted">Étapes logiques, pas des commits React mesurés.</span></div></section>`;}
function xProbeView(){const list=xSeed, target=list.find(j=>j.id===xProbeId);let output,example,meaning;if(xProbe==='find'){output=target??null;example='candidatures.find(c => c.id === id) ?? null';meaning='Retour : objet unique ou null ; le tableau original reste intact.';}else if(xProbe==='filter'){output=list.filter(j=>j.id!==xProbeId).map(j=>j.entreprise);example='candidatures.filter(c => c.id !== id)';meaning='Retour : nouveau tableau ; la collection originale ne change pas.';}else if(xProbe==='map'){output=list.map(j=>({entreprise:j.id===xProbeId?j.entreprise+' (modifiée)':j.entreprise,memeReference:j.id!==xProbeId}));example='candidatures.map(c => c.id === id ? updated : c)';meaning='Retour : nouveau tableau ; seul l’objet ciblé est remplacé s’il existe.';}else{output=formatDate(xProbeArg||undefined);example='formatDate(date)';meaning='Retour : chaîne localisée ou tiret, avec le fuseau du navigateur.';}return `<section class="panel"><div class="row between"><h3>Micro-banc de fonctions</h3><span class="filetag">INPUT → OUTPUT</span></div><p class="tiny">Exécutions JavaScript isolées sur les trois données de la capture.</p><div class="tabs">${['find','filter','map','formatDate'].map(k=>xButton('probe',k+'()',`data-probe="${k}"`,xProbe===k?'on':'')).join('')}</div>${xProbe==='formatDate'?`<label>Argument date (vide = undefined)<input data-xchange="probeArg" value="${esc(xProbeArg)}" class="selectwide"></label>`:`<label>Argument id<select data-xchange="probeId" class="selectwide">${options({...Object.fromEntries(list.map(j=>[j.id,j.entreprise])),missing:'ID inexistant'},xProbeId)}</select></label>`}${code(example)}<label>Prédiction : écris le résultat attendu avant de le révéler</label><textarea id="xprediction" placeholder="Que retourne la fonction ?">${esc(xPrediction)}</textarea><div class="row" style="margin-top:8px">${xButton('reveal',xReveal?'Masquer le résultat':'Exécuter / révéler', '', 'primary')}</div>${xReveal?`${code(JSON.stringify(output,null,2))}<p>${esc(meaning)}</p>`:''}</section>`;}
function inspect(){const s=xCurrent();return `<div class="pagehead"><div><div class="eyebrow">Atelier 08 · Jobboard · X-Ray</div><h1>Dissection fonctionnelle</h1><p>De l’atome de code au composant : observe, prédis, exécute, puis explique.</p></div><span class="tag">V0.2 · NOUVEAU</span></div><div class="panel xcontrols"><div class="row between"><div class="tabs" style="margin:0">${xButton('mode','Normal','data-mode="normal"',xMode==='normal'?'on':'')}${xButton('mode','Inspect / X-Ray','data-mode="inspect"',xMode==='inspect'?'on':'')}</div><div class="row">${xButton('event','↻ Actualiser',`data-event="reload" ${!xEnd()?'disabled':''}`)}${xButton('reset','Réinitialiser')}</div></div><label class="choice" style="margin-bottom:0"><input type="checkbox" data-xchange="fault" ${xFault?'checked':''} ${!xEnd()?'disabled':''}>Injecter une panne d’écriture localStorage lors de la prochaine sauvegarde</label></div><div class="xworkspace">${xPreview(s)}${xInspector(s)}</div>${xTimeline()}<div class="workgrid xlower">${xFlow(s)}${xStatePanel(s)}</div><div class="section-title"><h2>Atelier de micro-dissection</h2><span class="mono tiny muted">${Object.keys(xUnits).length} UNITÉS · 5 ÉCHELLES</span></div><div class="workgrid"><section class="panel"><h3>Explorateur des pièces</h3><p class="tiny">Sélectionne une unité pour retrouver sa fiche dans l’inspecteur.</p><div class="tabs">${['all',...xLevels.map((_,i)=>String(i))].map(k=>xButton('level',k==='all'?'Toutes':xLevels[+k],`data-level="${k}"`,xLevel===k?'on':'')).join('')}</div><div class="xunits">${Object.entries(xUnits).filter(([,u])=>xLevel==='all'||u.level===+xLevel).map(([k,u])=>xButton('unit',`<span>${esc(u.title)}</span><small>${esc(u.file)} · N${u.level}</small>`,`data-unit="${k}"`,xUnit===k?'on':'')).join('')}</div><div class="callout tiny">Les extraits reproduisent le code fourni ou sont signalés comme extraits. Les modes et IDs de la capture ont été complétés pour le modèle. Le formulaire est une reconstitution, pas le document.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;let a=b.dataset.x;switch(a){case'unit':xUnit=b.dataset.unit;xFocusId=b.dataset.id||null;xField=b.dataset.field||null;render();return;case'select':xTrace('select',b.dataset.id);return;case'event':if(b.dataset.event==='delete'&&!confirm('Supprimer définitivement cette candidature de la simulation ?'))return;xTrace(b.dataset.event,b.dataset.id);return;case'mode':xMode=b.dataset.mode;break;case'reset':xStop();xState=xInitial();xFrames=[];xStep=0;xUnit='selectedId';xFocusId=null;xField=null;xFault=false;xDraft=null;xCounter=4;break;case'step':xStop();xNavigate(+b.dataset.index);return;case'prev':xStop();xNavigate(xStep-1);return;case'next':xStop();xNavigate(xStep+1);return;case'finish':xStop();xNavigate(xFrames.length-1);return;case'play':if(xTimer){xStop();render();return;}if(xEnd())xStep=0;xTimer=setInterval(()=>{if(page!=='inspect'){xStop();return;}xNavigate(xStep+1)},1250);render();return;case'level':xLevel=b.dataset.level;break;case'probe':xProbe=b.dataset.probe;xReveal=false;xPrediction='';break;case'reveal':xReveal=!xReveal;break;default:return;}render();});

const s3Kind={VariableDeclaration:'Liaison locale : nom, annotation éventuelle et initialiseur.',VariableDeclarationList:'Déclaration de variables ; const empêche la réaffectation de la liaison, pas la mutation profonde.',Identifier:'Nom d’une liaison ou d’une propriété. Son rôle dépend du contexte syntaxique.',Parameter:'Paramètre déclaré dans une fonction. L’argument est la valeur fournie lors de l’appel.',ArrowFunction:'Fonction fléchée. Elle peut être passée comme valeur et exécutée plus tard.',CallExpression:'Appel de fonction ou de méthode : cible et arguments.',PropertyAccessExpression:'Accès à une propriété d’un objet par son nom.',ElementAccessExpression:'Accès calculé à une propriété par une clé.',BinaryExpression:'Expression binaire : opérande gauche, opérateur, opérande droit.',QuestionQuestionToken:'Coalescence : utilise la droite si la gauche vaut null ou undefined.',EqualsEqualsEqualsToken:'Comparaison stricte : produit un booléen sans conversion implicite.',ExclamationEqualsEqualsToken:'Inégalité stricte.',AmpersandAmpersandToken:'ET logique à court-circuit ; si la gauche est falsy, la droite n’est pas évaluée.',SpreadElement:'Expansion des éléments d’un itérable dans un nouveau tableau.',SpreadAssignment:'Copie superficielle des propriétés propres énumérables vers un objet.',ComputedPropertyName:'Nom de propriété calculé à partir d’une expression.',ReturnStatement:'Termine l’exécution de la fonction et renvoie éventuellement une valeur.',IfStatement:'Exécute une branche conditionnellement.',ConditionalExpression:'Expression ternaire : condition ? valeur vraie : valeur fausse.',FunctionDeclaration:'Déclaration d’une fonction nommée.',JsxAttribute:'Attribut JSX : peut transmettre une prop à un composant.',JsxExpression:'Délimite une expression JavaScript dans JSX.',ObjectLiteralExpression:'Construction d’un nouvel objet.',ArrayLiteralExpression:'Construction d’un nouveau tableau.',PropertyAssignment:'Propriété et valeur d’un objet littéral.',BindingEl function s3explain(n,u){if(!n)return u.description;const t=n.text.trim();const special={selectedId:'Identifiant de sélection : string | null. Lu dans find(), modifié par setSelectedId. Il ne stocke pas la candidature.',setSelectedId:'Setter obtenu de useState. Transmis à ApplicationTable sous le nom onRowClick. Programme une mise à jour, sans changer le snapshot local du rendu en cours.',candidatures:'Collection métier obtenue avec useSyncExternalStore ; une référence de tableau pour ce rendu.',candidature:'Dans le callback de find/map/filter, paramètre qui reçoit l’objet parcouru. Dans le tableau, variable de la ligne.',onRowClick:'Prop de fonction (id: string) => void. Sa valeur réelle ici est setSelectedId.', 'candidature.id':'Accès à la propriété string id. Dans onRowClick(candidature.id), la valeur devient un argument.', 'candidature.id === selectedId':'Prédicat : compare la clé de l’objet courant à l’identifiant recherché. Résultat booléen.',selectedCandidature:'Donnée dérivée : objet trouvé dans le tableau ou null. Pas de useState supplémentaire.',editingId:'Identifiant d’édition. Il ne change pas au clic simple sur une ligne.',showForm:'Booléen d’interface. Il ne change pas au clic simple sur une ligne.', '??':'Opérateur de secours : undefined ou null déclenche la valeur à droite.', 'find':'Méthode de tableau qui renvoie le premier élément correspondant ou undefined.', 'name':'Nom du champ DOM, utilisé comme clé calculée dans le nouvel état.', 'value':'Valeur lue dans le champ du formulaire.', 'prev':'Paramètre de la fonction de mise à jour : React fournit l’état précédent.', '...prev':'Copie superficielle des propriétés énumérables du formulaire précédent.', '[name]':'Nom de propriété calculé à partir de la valeur de name.'};return special[t]||s3Kind[n.k]||'Nœud syntaxique réel du parseur TypeScript. Lis son contexte et les nœuds enfants pour déterminer sa responsabilité.'}
function s3sourceCode(u,n){let off=0;return u.source.split('\n').map((l,i)=>{const start=off,end=off+l.length;off=end+1;const cuts=new Set([start,end]);if(n){cuts.add(Math.max(start,Math.min(end,n.start)));cuts.add(Math.max(start,Math.min(end,n.end)));}const leaves=u.nodes.map((v,j)=>({...v,j})).filter(v=>v.start>=start&&v.end<=end&&v.end>v.start&&!u.nodes.some(w=>w.parent===v.j));leaves.forEach(v=>{cuts.add(v.start);cuts.add(v.end)});const points=[...cuts].sort((a,b)=>a-b);let out='';for(let k=0;k<points.length-1;k++){const a=points[k],b=points[k+1],v=leaves.find(v=>v.start<=a&&v.end>=b);const hi=n&&a>=n.start&&b<=n.end;const txt=esc(u.source.slice(a,b));out+=v?`<span role="button" tabindex="0" data-s3="node" data-index="${v.j}" class="tok ${hi?'activecode':''}" title="${esc(v.k)}">${txt}</span>`:hi?`<span class="activecode">${txt}</span>`:txt;}return `<div class="line3"><span class="ln">${u.line+i}</span><span>${out||' '}</span></div>`}).join('')}
function s3note(key,label,placeholder){return `<div class="note3"><label for="n-${key}">${label}</label><textarea id="n-${key}" data-s3note="${key}" placeholder="${esc(placeholder)}">${esc(s3notes[key]||'')}</textarea><p class="small3" id="s3persist">Notes locales à ce navigateur · exportables.</p></div>`}
function s3analogy(u){const analogies={Atome:'Une valeur ou un nom isolé, comme une étiquette posée sur une pièce.',Expression:'Une petite règle qui combine des valeurs, comme un assemblage simple.',Fonction:'Un outil qui reçoit des entrées et produit un résultat.',Composant:'Un sous-ensemble qui reçoit des connexions et présente une partie de l’interface.',Interaction:'Une commande qui transmet une information vers une autre partie du système.',Système:'Plusieurs sous-ensembles reliés qui coopèrent.'};return analogies[u.level]||'Une pièce d’un ensemble plus large. Ouvre les niveaux voisins pour voir comment ils se relient.'}
function s3bridge(){const result=s3bridgeId==='missing'?null:xSeed.find(c=>c.id===s3bridgeId)||null,expected=result?'found':'empty';return `<section class="spane bridge3" style="margin-top:14px"><div class="tokenhead"><div><span class="eyebrow">Palier guidé · une seule entrée</span><h3>Que devient le détail si l’ID change ?</h3></div><span class="pill3">EXPÉRIENCE ISOLÉE</span></div><p>Tu modifies uniquement l’identifiant donné à <code>find</code>. Le code, la collection et le stockage restent intacts.</p><div class="split3"><label for="s3bridgeid">ID recherché<select id="s3bridgeid">${[...xSeed.map(c=>[c.id,c.entreprise]),['missing','Identifiant absent']].map(([id,label])=>`<option value="${id}" ${s3bridgeId===id?'selected':''}>${esc(label)} · ${id}</option>`).join('')}</select></label><label for="s3bridgeprediction">Avant d’exécuter, que renvoie <code>find(...) ?? null</code> ?<select id="s3bridgeprediction"><option value="">Choisir une prédiction</option><option value="found" ${s3bridgePrediction==='found'?'selected':''}>Une candidature correspondante</option><option value="empty" ${s3bridgePrediction==='empty'?'selected':''}>null, aucun détail ne s’ouvre</option></select></label></div><div class="controls3">${s3btn('bridge-run','Vérifier ma prédiction','','primary')}${s3btn('bridge-reset','Recommencer','','ghost')}</div><p class="small3" id="s3bridgeHint">${s3bridgeRun?'Résultat révélé. Change uniquement l’ID pour comparer les deux cas.':s3bridgePrediction?'Prédiction enregistrée. Exécute pour la comparer au résultat.':'Choisis ta prédiction avant de révéler le résultat.'}</p>${s3bridgeRun?`<div class="result3">${result?`find renvoie ${result.id} (${esc(result.entreprise)}), puis ?? conserve la candidature. Le DetailDrawer peut s’ouvrir.`:'find renvoie undefined, puis ?? produit null. Le DetailDrawer reste fermé.'}</div><p class="small3">${s3bridgePrediction===expected?'Prédiction correcte.':'Compare ta prédiction au résultat, puis change une seule fois l’ID pour observer l’autre cas.'}</p>`:'<div class="empty3">Résultat masqué</div>'}</section>`}
function s3liveRun(id){const value=String(id??'').trim()||null,before=s3liveSelectedId,found=value?xSeed.find(c=>c.id===value)||null:null;s3liveSelectedId=value;s3liveCount++;s3liveRuns=[...s3liveRuns,{count:s3liveCount,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),before,id:value,found:found?{id:found.id,entreprise:found.entreprise}:null}].slice(-6)}
function s3livePanel(){const found=s3liveSelectedId?xSeed.find(c=>c.id===s3liveSelectedId)||null:null;const value=v=>v===null?'null':JSON.stringify(v);return `<section class="spane livepanel3" style="margin-top:14px"><div class="tokenhead"><div><span class="eyebrow">Flux de données · mise à jour en direct</span><h3>Comment le système réagit à chaque action</h3></div><span class="pill3">SIMULATION DU SNAPSHOT</span></div><p>Essaie plusieurs actions dans n’importe quel ordre. Chaque action recalcule selectedId, le résultat de find et l’affichage du détail.</p><p class="small3">Cette simulation exécute le modèle pédagogique sur les données fictives. Elle ne lance pas le runtime React de Jobboard.</p><div class="controls3">${xSeed.map(c=>s3btn('live-action',`Sélectionner ${esc(c.entreprise)}`,`data-id="${c.id}"`)).join('')}${s3btn('live-action','Tester un ID absent','data-id="id-inconnu"','ghost')}</div><div class="liveinput3"><label for="s3liveInput">Ou simuler un ID arbitraire</label><input id="s3liveInput" value="${esc(s3liveInput)}" placeholder="Ex. id-inconnu"><button type="button" data-s3="live-custom">Envoyer cet ID</button>${s3btn('live-clear','Effacer la sélection','','ghost')}</div><div class="flowline3 liveflow3" aria-label="Flux actuel" aria-live="polite" aria-atomic="true"><span>Action ${s3liveCount||'—'}</span><b aria-hidden="true">→</b><span>onRowClick(id)</span><b aria-hidden="true">→</b><span>setSelectedId</span><b aria-hidden="true">→</b><span>find + ?? null</span><b aria-hidden="true">→</b><span>${found?'DetailDrawer ouvert':'DetailDrawer fermé'}</span></div><div class="monitor3 livestate3"><div><small>selectedId</small><strong>${esc(value(s3liveSelectedId))}</strong></div><div><small>selectedCandidature</small><strong>${found?esc(found.id+' · '+found.entreprise):'null'}</strong></div><div><small>DetailDrawer</small><strong>${found?'monté':'fermé'}</strong></div><div><small>showForm</small><strong>false · inchangé</strong></div><div><small>editingId</ function s3Source(){const u=s3get(s3id), n=u.nodes[s3node];const files=[...new Set(S3.units.map(u=>u.file))];const matches=S3.units.filter(u=>(s3level==='Toutes'||s3level===u.level)&&(!s3search||[u.title,u.file,u.source].join(' ').toLowerCase().includes(s3search.toLowerCase())));const groups=files.filter(f=>matches.some(u=>u.file===f));const ast=u.nodes.map((n,i)=>({...n,i})).filter(v=>s3astFilter==='all'||s3astFilter==='leaves'&&!u.nodes.some(w=>w.parent===v.i)||s3astFilter==='calls'&&/CallExpression|ArrowFunction|Parameter|FunctionDeclaration/.test(v.k));const parent=n&&n.parent>=0?u.nodes[n.parent]:null;const range=u.line+(u.source.match(/\n/g)||[]).length;return `<div class="srcgrid"><section class="spane"><h3>Source explorer</h3><p class="small3">${S3.units.length} unités · ${files.length} fichiers</p><input class="search3" id="s3search" value="${esc(s3search)}" placeholder="Rechercher : find, id…" aria-label="Rechercher une unité"><label for="s3level">Échelle du code</label><select id="s3level" aria-label="Échelle du code">${['Toutes','Atome','Expression','Fonction','Composant','Interaction','Système'].map(l=>`<option ${s3level===l?'selected':''}>${l}</option>`).join('')}</select><div class="srcfiles">${groups.map(f=>`<div class="file-title">${esc(f.replace('src/',''))}</div>${matches.filter(u=>u.file===f).map(u=>s3btn('unit',esc(u.title),`data-id="${u.id}" aria-pressed="${s3id===u.id}"`)).join('')}`).join('')||'<p>Aucun résultat.</p>'}</div></section><section class="spane"><div class="tokenhead"><div><span class="eyebrow">Code source / ${esc(u.level)}</span><h3>${esc(u.title)}</h3></div><span class="pill3">${u.verified?'BLOB VÉRIFIÉ':u.note?'EXTRAIT ADAPTÉ':'EXTRAIT'}</span></div><a class="filelink" href="${S3URL+u.file}#L${u.line}-L${range}" target="_blank" rel="noreferrer">${esc(u.file)} · L${u.line}–${range} ↗</a><div class="sourcecode" id="s3code">${s3sourceCode(u,n)}</div><p class="code3note">${esc(u.note||u.context||'Clique sur un nom ou un littéral, ou sélectionne un nœud de l’AST.')}</p><div class="tokenhead" style="margin-top:14px"><h3>AST · microscope syntaxique</h3><span class="pill3">${u.nodes.length} nœuds</span></div><div class="nodefilter">${['all','leaves','calls'].map(k=>s3btn('astfilter',({all:'Arbre',leaves:'Atomes',calls:'Fonctions'})[k],`data-filter="${k}" aria-pressed="${s3astFilter===k}"`,'tiny')).join('')}</div><div class="astlist" id="s3ast">${ast.map(v=>s3btn('node',`<span style="padding-left:${Math.min(v.depth,7)*9}px">${esc(v.k)}</span><span class="asttext">${esc(v.text.replace(/\s+/g,' ').slice(0,90))}</span>`,`data-index="${v.i}" aria-pressed="${s3node===v.i}"`,'astrow')).join('')||'<p class="small3">Aucun nœud correspondant.</p>'}</div><p class="small3">AST calculé à la construction avec TypeScript ${esc(S3.tsVersion)} ; pas de vérification de types globale ni de trace runtime. ${u.diagnostics.length?'Le fragment comporte un diagnostic syntaxique.':'Aucun diagnostic syntaxique pour ce fragment.'}</p></section><section class="spane"><span class="eyebrow">Anatomy inspector</span><h3>${n?esc(n.k):esc(u.title)}</h3><div class="facts3"><div><small>PIÈCE ISOLÉE</small><div class="factcode anatomy-note3">${esc(n?n.text:u.title)}</div></div><div><small>CE QUE FAIT LE CODE</small>${esc(s3explain(n,u))}</div><div><small>CONTEXTE</small>${esc(parent?parent.k:u.file)}${parent?`<div class="controls3">${s3btn('node','↑ Nœud parent',`data-index="${n.parent}"`,'tiny')}</div>`:''}</div><div><small>ÉCHELLE D’ANALYSE</small>${esc(u.level)} · ${esc(u.description)}</div></div><details class="analogy3"><summary>Analogie mécanique facultative</summary><p>${esc(s3analogy(u))}</p><p class="small3">Garde le sens du code comme repère principal ; l’analogie est une aide, pas une définition.</p></details>${s3note('unit:'+u.id,'Ma lecture avant de reconstruire','Explique cette pièce avec tes mots. Que se passe-t-il si elle disparaît ?')}<div class="controls3">${s3btn('clear-node','Vue unité','','ghost tiny')}${s3btn('tab','Retour mission','data-tab="mission"','tiny')}</div></section></div>`}
const s3steps=[{label:'Clic',unit:'callback',desc:'L’utilisateur active la ligne. La fonction fléchée passée à onClick est appelée, pas exécutée pendant le rendu initial.',code:'onClick={() => onRowClick(candidature.id)}'},{label:'Argument',unit:'callback',desc:'Le code lit la propriété id de l’objet de la ligne. L’argument concret circule vers onRowClick.',code:'candidature.id'},{label:'Callback',unit:'props',desc:'onRowClick est une prop de fonction. Dans le Dashboard, sa valeur est setSelectedId.',code:'onRowClick={setSelectedId}'},{label:'Setter',unit:'state',desc:'Le setter demande une mise à jour. Les valeurs du rendu en cours restent celles de ce rendu ; aucun autre état n’est modifié.',code:'setSelectedId(id)'},{label:'Rendu + find',unit:'find',desc:'Au prochain rendu, selectedId a la nouvelle valeur. find compare chaque ID jusqu’au premier résultat.',code:'candidatures.find(candidature => candidature.id === selectedId)'},{label:'Dérivée',unit:'find',desc:'find renvoie l’objet (ou undefined). ?? null rend l’absence explicite. Aucun tableau n’a été remplacé.',code:'const selectedCandidature = … ?? null;'},{label:'Drawer',unit:'drawer',desc:'Le rendu conditionnel reçoit une candidature et peut monter le tiroir. La collection et le stockage restent inchangés.',code:'selectedCandidature && (<DetailDrawer … />)'}];

function s3mission(){const target=xSeed.find(x=>x.id===s3target)||xSeed[0],cur=s3steps[s3stage],sid=s3stage>=4?target.id:null,derived=s3stage>=5?target:null;const status=(v)=>esc(JSON.stringify(v));const pred=s3unlocked?`<div class="call3">Hypothèse conservée : ${esc(s3predict)}<br>Variable prédite : ${esc(s3answer)}</div>`:`<div class="pred3"><label for="s3prediction">1 · Prédis le trajet avant de l’exécuter.</label><textarea id="s3prediction" placeholder="Quelles fonctions se déclenchent ? Qu’est-ce qui change ?">${esc(s3predict)}</textarea><label for="s3answer">Quel état le clic modifie-t-il ?</label><select id="s3answer"><option value="">Choisir une hypothèse</option>${['selectedId uniquement','showForm uniquement','editingId uniquement','Les trois états','Aucun état'].map(v=>`<option ${s3answer===v?'selected':''}>${esc(v)}</option>`).join('')}</select><div class="controls3">${s3btn('start','Exécuter ma prédiction','','primary')}</div><p class="small3" id="s3hint">Aucune solution n’apparaît avant ton hypothèse.</p></div>`;return `<div class="missiongrid"><section class="spane"><div class="tokenhead"><div><span class="eyebrow">Mission 001 / rétro-ingénierie</span><h2>Du clic au composant</h2></div><span class="pill3">TRACE SCÉNARISÉE</span></div><p>Choisis une ligne et prédis l’impact d’un clic. Le modèle reprend les sept colonnes de la capture, sans écrire dans Jobboard.</p><div class="preview3" style="margin-top:12px"><p style="color:#2563eb;font-size:11px">Suivi candidatures</p><h3>Tableau de bord</h3><table><thead><tr>${['Entreprise','Poste visé','Contrat','Statut','Priorité','Créée le','Relance'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${xSeed.map(j=>`<tr class="${s3target===j.id?'sel3':''}"><td>${s3btn('target',esc(j.entreprise),`data-id="${j.id}" ${s3unlocked?'disabled':''}`,'rowpick')}</td><td>${esc(j.posteVise)}</td><td>${esc(contracts[j.contrat])}</td><td>${statusBadge(j.statut)}</td><td>${prioBadge(j.priorite)}</td><td>${esc(formatDate(j.d     const list=t?.before || (state.duplicate?[...seed,{...seed[1],entreprise:'Doublon de test'}]:seed);

    return `<svg viewBox="0 0 680 250" role="img" aria-label="Comparateurs successifs et références avant après" class="m2diagram"><text x="14" y="18" class="m2svgtext">TABLEAU A · original</text>${list.map((c,i)=>{const x=offset+i*dx+80, passed=i<examined, match=passed&&t.comparisons[i].equal,col=!passed?'#52666e':match?'#64dac4':'#8eabb5',fromRef='O'+(i+1),toRef=match?'U':fromRef;return `<rect x="${x-70}" y="30" width="140" height="48" rx="7" fill="#20343d" stroke="#52666e"/><text x="${x}" y="49" class="m2svgtext" text-anchor="middle">${esc2(c.entreprise.length>21?c.entreprise.slice(0,19)+'…':c.entreprise)}</text><text x="${x}" y="65" class="m2svgmuted" text-anchor="middle">${fromRef} · ${esc2(c.id)}</text><path d="M${x} 78 V99 M${x} 157 V181" stroke="${col}" stroke-width="${passed?3:1}" stroke-dasharray="${passed?'0':'4 4'}"/>${gear(x,128,passed?examined*25:0,col)}<rect x="${x-70}" y="182" width="140" height="42" rx="7" fill="${match?'#214940':'#20343d'}" stroke="${col}"/><text x="${x}" y="199" text-anchor="middle" class="m2svgtext">${passed?(match?'true → U':'false → '+toRef):'En attente'}</text><text x="${x}" y="215" text-anchor="middle" class="m2svgmuted">${passed?esc2(labels[t.comparisons[i].result.statut]):'—'}</text>`}).join('')}<text x="14" y="244" class="m2svgtext">${assembled?'TABLEAU B · nouvelle référence':'SORTIES DU CALLBACK · en construction'}</text></svg>`;
  }
  function table(list, title, refs) {return `<div class="m2tablebox"><h4>${title}</h4><table><thead><tr><th>Objet</th><th>Entreprise</th><th>Statut</th></tr></thead><tbody>${list.map((c,i)=>`<tr><td><code>${refs[i]}</code></td><td>${esc2(c.entreprise)}</td><td>${esc2(labels[c.statut]||c.statut)}</td></tr>`).join('')}</tbody></table></div>`;}
  function mission() {
    const t=state.trace, all=t?stages(t):[], current=t?all[state.step]:null, n=t?.before.length||0;
    const examined=t?Math.min(n,Math.max(0,state.step)):0, assembled=t&&state.step>=n+1, cacheOn=t&&state.step>=n+2, persistedOn=t&&state.step>=n+3, notified=t&&state.step>=n+4, finished=t&&state.step===all.length-1;
    const base=t?.before||seed, ids=base.map((_,i)=>'O'+(i+1));
    const mem=t&&assembled?table(t.next,'Tableau B · résultat',t.next.map((c,i)=>Object.is(c,t.argument)?'U':ids[i])):'<div class="m2empty">Résultat masqué jusqu’à la fin de map.</div>';
    const stack=current?.stack||[];
    return `<div class="sal3 m2" id="m2-workbench"><div class="labhead"><div><span class="eyebrow">Atelier 09 / V0.4 en développement</span><h1>Mission 002 · Function Dynamics</h1><p>De l’argument à la persistance — updateCandidature()</p></div><span class="tag">JS EXÉCUTÉ · REPLAY PÉDAGOGIQUE</span></div><div class="subtabs"><button type="button" data-s3="tab" data-tab="mission">← Mission 001</button><button type="button" data-s3="unit" data-id="update">Sources & AST ↗</button><button type="button" data-s3="tab" data-tab="notes">Carnet ↗</button></div><p class="m2intro">Le modèle exécute réellement <code>map</code> en JavaScript puis rejoue une trace capturée. Les données sont fictives et réduites ; cache, stockage et notification sont simulés, pas le runtime React. Aucun accès au storage de Jobboard.</p>
    <div class="m2grid"><section class="spane"><span class="eyebrow">01 / Préparer</span><h3>Injecte un argument</h3><label for="m2id">Identifiant cible</label><select id="m2id" ${t?'disabled':''}>${[...seed.map(c=>[c.id,c.entreprise+' · '+c.id]),['missing','ID absent · missing']].map(([v,l])=>opt(v,l,state.id)).join('')}</select><label for="m2statut">Nouveau statut</label><select id="m2statut" ${t?'disabled':''}>${Object.entries(labels).map(([v,l])=>opt(v,l,state.statut)).join('')}</select><label class="m2check"><input id="m2fail" type="checkbox" ${state.fail?'checked':''} ${t?'disabled':''}> Simuler un échec de setItem</label><label class="m2check"><input id="m2duplicate" type="checkbox" ${state.duplicate?'checked':''} ${t?'disabled':''}> Injecter un doublon de demo_002</label><div class="m2prediction"><h4>Prédire avant de lancer</h4><label for="m2prediction">Combien d’objets map remplacera-t-il ?</label><select id="m2prediction" ${t?'disabled':''}>${[['','Choisir'],['0','0'],['1','1'],['2','2'],['3','3'],['4','4']].map(([v,l])=>opt(v,l,state.prediction)).join('')}</select><label for="m2durable">Après la sauvegarde, cache et stockage auront-ils le même contenu ?</label><select id="m2durable" ${t?'disabled':''}>${[['','Choisir'],['yes','Oui'],['no','Non']].map(([v,l])=>opt(v,l,state.durable)).join('')}</select><label for="m2note">Pourquoi ? (facultatif)</label><textarea id="m2note" rows="2" ${t?'disabled':''} placeholder="Mon hypothèse…">${esc2(state.note)}</textarea></div><div class="controls3">${btn('start','Lancer l’expérience',!!t,'primary')}${btn('reset','Nouvelle expérience',false,'ghost')}</div><p id="m2hint" role="status" class="small3">${t?'Trace prête. Avance ou utilise la lecture automatique.':'Deux prédictions sont nécessaires.'}</p></section>
    <section class="spane"><span class="eyebrow">02 / Disséquer</span><h3>Source Code</h3><a class="filelink" href="${reference}components/ApplicationsDashboard.tsx#L29-L34" target="_blank" rel="noreferrer">Jobboard · commit 52c5142 · lignes 29–34 ↗</a><div class="m2code">${source.map((l,i)=>`<div class="${current?.line===i?'m2active':''}"><span>${29+i}</span><code>${esc2(l)}</code></div>`).join('')}</div><details class="analogy3"><summary>Les petites unités</summary><dl><dt>updatedCandidature</dt><dd>Paramètre formel, lié à l’objet fourni lors de l’appel.</dd><dt>candidatures</dt><dd>Variable de la portée englobante, utilisée par cette fonction (fermeture).</dd><dt>candidature</dt><dd>Paramètre du callback, lié à chaque objet parcouru.</dd><dt>===</dt><dd>Comparaison stricte des identifiants, résultat booléen.</dd><dt>? :</dt><dd>Expression conditionnelle : choisit une référence.</dd><dt>saveCandidatures(...)</dt><dd>Appel qui produit des effets de bord, sans valeur de retour utile.</dd></dl></details><h4>Argument de l’appel</h4>${t?`<pre>${esc2(JSON.stringify(t.argument,null,2))}</pre>`:'<div class="m2empty">Visible dès le lancement.</div>'}<h4>Pile d’appels <small>illustrative</small></h4><div class="m2stack">${stack.length?stack.slice().reverse().map((s,i)=>`<div class="${i===0?'active':''}">${esc2(s)}</div>`).join(''):'<div class="m2empty">Pile vide pour ce scénario</div>'}</div></section></div>
    <section class="spane m2wide"><div class="tokenhead"><div><span class="eyebrow">03 / Mécanisme</span><h3>Transmission et comparaison</h3></div><span class="pill3">${examined}/${t?n:base.length} comparaisons</span></div><div class="m2timeline" aria-label="Étapes de la mission">${(t?all:[{title:'Appel'},{title:'Comparaisons'},{title:'Assemblage'},{title:'Cache'},{title:'Persistance'},{title:'Notification'}]).map((s,i)=>`<button type="button" data-m2="jump" data-step="${i}" ${!t?'disabled':''} aria-pressed="${state.step===i}" class="${t&&i<state.step?'past':''}">${i+1}. ${esc2(s.title)}</button>`).join('')}</div><div class="m2controls">${btn('prev','← Précédent',!t||state.step===0)}${btn('next','Étape suivante →',!t||finished,'primary')}${btn('play',state.playing?'Pause':'Lecture automatique',!t||finished,'ghost')}</div><div class="m2stage" aria-live="polite"><strong>${current?esc2(current.title):'Mécanisme à l’arrêt'}</strong><p>${current?esc2(current.desc):'Choisis un scénario et inscris tes prédictions.'}</p>${current?.index!==undefined?`<code>${j(t.comparisons[current.index].candidature.id)} === ${j(t.argument.id)} → ${t.comparisons[current.index].equal}</code>`:''}</div><details class="analogy3" open><summary>Vue mécanique · comparateurs et transmission</summary>${diagram(t,examined,assembled)}<p class="small3">O1, O2… et U sont des identifiants pédagogiques, pas des adresses mémoire.</p></details></section>
    <section class="spane m2wide"><span class="eyebrow">04 / Références et effets</span><h3>Memory View</h3><div class="m2grid">${table(base,'Tableau A · original',ids)}${mem}</div><div class="m2metrics"><div><small>Object.is(A, B)</small><strong>${assembled?String(Object.is(t.before,t.next)):'—'}</strong></div><div><small>Objets remplacés</small><strong>${assembled?t.replaced:'—'}</strong></div><div><small>Cache</small><strong>${cacheOn?'B':'A'}</strong></div><div><small>Écriture storage</small><strong>${persistedOn?(t.error?'Échec':'Réussie'):'En attente'}</strong></div><div><small>Notifications (modèle)</small><strong>${notified?t.notifications:0}</strong></div><div><small>Valeur de retour</small><strong>${finished?'undefined':'—'}</strong></div></div>${persistedOn?`<div class="m2grid">${table(t.cache,'Contenu en mémoire',t.cache.map((c,i)=>Object.is(c,t.argument)?'U':ids[i]))}${table(t.persisted,'Contenu durable après relecture',t.persisted.map(()=> 'copie'))}</div><p class="m2stage">${t.error?'Le cache conserve B ; le stockage garde A. Une actualisation peut faire disparaître les modifications.':'Les contenus concordent ; une nouvelle lecture JSON recrée les références.'} ${t.replaced===0?'Aucun objet n’a été remplacé, mais une sauvegarde a tout de même été tentée.':''}</p>`:''}${assembled?`<p class="m2feedback ${Number(state.prediction)===t.replaced?'good':'bad'}">Prédiction des remplacements : ${Number(state.prediction)===t.replaced?'correcte':'à revoir'} (${t.replaced}).</p>`:''}${persistedOn?`<p class="m2feedback ${(state.durable==='yes')===(JSON.stringify(t.cache)===JSON.stringify(t.persisted))?'good':'bad'}">Prédiction cache / contenu durable : ${(state.durable==='yes')===(JSON.stringify(t.cache)===JSON.stringify(t.persisted))?'correcte':'à revoir'}. Les contenus ${JSON.stringify(t.cache)===JSON.stringify(t.persisted)?'concordent':'diffèrent'} même si les références sont distinctes.</p>`:''}<a class="filelink" href="${reference}lib/storage.ts#L104-L113" target="_blank" rel="noreferrer">Source : saveCandidatures ↗</a></section>
    ${finished?`<section class="spane m2wide"><span class="eyebrow">05 / Restituer</span><h3>Explique puis reconstruis</h3>${s3note('mission2:explanation','Mon explication','Pourquoi map crée-t-il B même si aucun ID ne correspond ? Pourquoi le cache peut-il diverger du stockage ?')}<details class="analogy3"><summary>Défi de reconstruction (sans solution)</summary><p>Écris une fonction de mise à jour d’un livre par ID, puis une version qui renvoie aussi le nombre d’objets remplacés. Teste un ID absent, un doublon et la conservation des références. Sépare ensuite transformation pure et persistance.</p></details><div class="controls3"><button type="button" data-s3="tab" data-tab="notes">Ouvrir le carnet</button></div></section>`:''}<p class="small3">La mission isole updateCandidature ; les setters du formulaire et le rendu réel de React seront étudiés séparément. Les objets en entrée ne représentent pas le modèle Candidature complet.</p></div>`;
  }
  const original = renders.sourceLab;
  renders.sourceLab = function () {
    if (s3tab === 'mission2') return mission();
    return original().replace('<a class="filelink" style="margin:auto 0 auto auto"','<button type="button" data-s3="tab" data-tab="mission2" class="m2entry">05 · Mission 002 — Function Dynamics</button><a class="filelink" style="margin:auto 0 auto auto"');
  };
  document.addEventListener('change', e => {
    if (state.trace) return;
    const el=e.target;
    const keys={m2id:'id',m2statut:'statut',m2fail:'fail',m2duplicate:'duplicate',m2prediction:'prediction',m2durable:'durable'};
    if (keys[el.id]) state[keys[el.id]]=el.type==='checkbox'?el.checked:el.value;
  });
  document.addEventListener('input', e => { if(e.target.id==='m2note'&&!state.trace)state.note=e.target.value; });
  document.addEventListener('click', e=>{
    const control=e.target.closest('[data-m2]');
    if (!control) { if (state.playing) stop(); return; }
    const action=control.dataset.m2;
    if(action==='start'){
      if(!state.prediction||!state.durable){document.getElementById('m2hint').textContent='Choisis les deux prédictions avant d’exécuter.';return;}
      stop();state.trace=experiment(state.id,state.statut,state.fail,state.duplicate);state.step=0;
      s3notes['mission2:prediction']=`ID ${state.id}, statut ${state.statut}, échec ${state.fail}, doublon ${state.duplicate} : ${state.prediction} remplacement(s), contenus identiques : ${state.durable==='yes'?'oui':'non'}. ${state.note}`;s3store();
    } else if(action==='reset'){stop();state=fresh();}
    else if(!state.trace)return;
    else if(action==='play'){
      if(state.playing){stop();}else{state.playing=true;timer=setInterval(()=>{if(page!=='sourceLab'||s3tab!=='mission2'){stop();return;}state.step=Math.min(stages(state.trace).length-1,state.step+1);if(state.step===stages(state.trace).length-1)stop();renderMission();},1000);}
    }else{stop();const end=stages(state.trace).length-1;state.step=action==='next'?Math.min(end,state.step+1):action==='prev'?Math.max(0,state.step-1):action==='jump'?Math.max(0,Math.min(end,Number(control.dataset.step))):state.step;}
    renderMission();
  });
})();

window.addEventListener('hashchange',()=>{let id=location.hash.slice(1);if(renders[id]&&id!==page){page=id;render();window.scrollTo(0,0);}});let initial=location.hash.slice(1);if(renders[initial])page=initial;render();
</script></body></html>
